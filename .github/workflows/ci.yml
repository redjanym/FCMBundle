name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            symfony: '5.4.*'
            phpunit: '9.5.*'
          - php: '8.1'
            symfony: '5.4.*'
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '7.2.*'
          - php: '8.3'
            symfony: '7.2.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lock Symfony version
        run: |
          composer require --no-update \
            symfony/config:"${{ matrix.symfony }}" \
            symfony/dependency-injection:"${{ matrix.symfony }}" \
            symfony/http-kernel:"${{ matrix.symfony }}" \
            symfony/yaml:"${{ matrix.symfony }}"

      - name: Lock PHPUnit version
        if: matrix.phpunit
        run: composer require --dev --no-update phpunit/phpunit:"${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse
